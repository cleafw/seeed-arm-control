[project]
name = "rebot-record"
version = "0.2.0"
description = "StarAi Violin / Arm-102 leader + reBot B601-DM follower teleop / record / playback"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "motorbridge-smart-servo>=0.0.4",
    "numpy>=2.0",
    "pyserial>=3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
