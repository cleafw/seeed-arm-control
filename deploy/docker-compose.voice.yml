# Optional Voice sidecar (ASR/NLU → Core HTTP only). No serial/CAN devices.
#
# From repo root:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.voice.yml --profile voice up -d
#
# Core must expose /api/voice/* and preferably:
#   VOICE_ENABLED=1
#   VOICE_HEALTH_URL=http://voice:1883/health
#
# Text-only by default. For Whisper, mount model and set VOICE_WHISPER_MODEL.

services:
  voice:
    profiles: ["voice"]
    image: python:3.12-slim
    container_name: rebot-voice
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "pip install -q fastapi 'uvicorn[standard]' &&
      uvicorn voice.app:app --host 0.0.0.0 --port 1883"
    environment:
      PYTHONUNBUFFERED: "1"
      REBOT_CORE_URL: http://rebot-record:8000
      VOICE_TTS: log
      # VOICE_WHISPER_MODEL: /models/whisper-base
    ports:
      - "1883:1883"
    volumes:
      - ../voice:/app/voice:ro
      - ../backend:/app/backend:ro
      # - /path/to/whisper-base:/models/whisper-base:ro
    # No /dev mount — Voice must never see arm serial ports.
    networks:
      - default
