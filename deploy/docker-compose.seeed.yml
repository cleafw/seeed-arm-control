# Field-oriented Docker Compose (Seeed / Pi example)
#
# From repo root:
#   cp deploy/rebot.env.example .env   # or create your own
#   docker compose -f deploy/docker-compose.seeed.yml up -d --build
#
# UI: http://<host>:1882

name: rebot-record

services:
  rebot-record:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rebot-record:latest
    container_name: rebot-record
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "1882:8000"
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /dev:/dev
      - ../recordings:/app/recordings
      - ../backend:/app/backend:ro
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
      - "c 170:* rmw"
